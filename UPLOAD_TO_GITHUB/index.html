        .navbar-header {
          position: sticky;
          top: 0;
          z-index: 100;
          background: #FFFFFF;
          border-bottom: 1px solid var(--border-light);
          box-shadow: var(--shadow-sm);
        }
        .top-bar {
          background-color: var(--text-primary);
          color: #E6E0D4;
          font-size: 0.75rem;
          padding: 0.35rem 0;
          letter-spacing: 0.03em;
        }
        .top-bar-content {
          display: flex;
          justify-content: space-between;
          align-items: center;
          flex-wrap: wrap;
          gap: 0.5rem;
        }
        .top-location {
          font-weight: 500;
          color: #D6CFBE;
        }
        .top-social-contacts {
          display: flex;
          align-items: center;
          gap: 0.6rem;
        }
        .top-dot {
          color: #666;
        }
        .main-nav-container {
          padding: 0.85rem 0;
          background-color: #FFFFFF;
        }
        .main-nav {
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        .logo-brand {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          cursor: pointer;
          user-select: none;
          transition: transform 0.2s ease;
          flex-shrink: 0;
        }
        .logo-brand:hover {
          transform: scale(1.02);
        }
        .logo-glowing-wrapper {
          position: relative;
          padding: 2px;
          border-radius: 8px;
          background: linear-gradient(135deg, #DFB36E 0%, #C59B4E 50%, #8F6B2A 100%);
          box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
          animation: goldPulseHalo 3s ease-in-out infinite alternate;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          flex-shrink: 0;
        }
        @keyframes goldPulseHalo {
          0% { box-shadow: 0 0 8px rgba(212, 175, 55, 0.3); }
          100% { box-shadow: 0 0 18px rgba(243, 210, 106, 0.65); }
        }
        .header-brand-logo-img {
          height: 38px;
          width: 38px;
          object-fit: contain;
          border-radius: 6px;
          background-color: #0A0A0A;
          display: block;
          flex-shrink: 0;
        }
        .logo-text {
          display: flex;
          flex-direction: column;
          justify-content: center;
        }
        .brand-title-row {
          display: flex;
          align-items: baseline;
          gap: 0.4rem;
          line-height: 1.1;
        }
        .brand-dzone-highlighted {
          font-family: var(--font-heading);
          font-size: clamp(1.05rem, 4.2vw, 1.35rem);
          font-weight: 900;
          letter-spacing: 0.06em;
          background: linear-gradient(135deg, #1C1A17 0%, #D4AF37 40%, #B8860B 75%, #1C1A17 100%);
          background-size: 200% auto;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: goldShimmerText 6s linear infinite;
          text-transform: uppercase;
          filter: drop-shadow(0 1px 2px rgba(212, 175, 55, 0.2));
        }
        @keyframes goldShimmerText {
          0% { background-position: 0% center; }
          100% { background-position: 200% center; }
        }
        .brand-collection-badge {
          font-family: var(--font-heading);
          font-size: clamp(0.6rem, 2vw, 0.75rem);
          font-weight: 800;
          letter-spacing: 0.18em;
          color: #B8860B;
          text-transform: uppercase;
          background: var(--accent-gold-light);
          padding: 0.1rem 0.4rem;
          border-radius: var(--radius-sm);
          border: 1px solid rgba(212, 175, 55, 0.35);
          white-space: nowrap;
        }
        .brand-sub {
          font-size: 0.6rem;
          letter-spacing: 0.22em;
          color: var(--accent-gold-dark);
          font-weight: 700;
          margin-top: 2px;
          text-transform: uppercase;
        }
        [data-theme="dark"] .brand-dzone-highlighted {
          background: linear-gradient(135deg, #FFFFFF 0%, #F5D77F 45%, #D4AF37 80%, #FFFFFF 100%);
          background-size: 200% auto;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
        [data-theme="dark"] .brand-collection-badge {
          color: #F3D26A !important;
          background: rgba(212, 175, 55, 0.15) !important;
          border-color: rgba(212, 175, 55, 0.4) !important;
        }
        .nav-and-icons-group {
          display: flex;
          align-items: center;
          gap: 1.5rem;
        }
        .desktop-menu {
          display: none;
          align-items: center;
          gap: 1.5rem;
        }
        @media (min-width: 900px) {
          .desktop-menu {
            display: flex;
          }
        }
        .nav-link {
          font-size: 0.825rem;
          font-weight: 600;
          letter-spacing: 0.08em;
          color: var(--text-secondary);
          padding: 0.35rem 0;
          position: relative;
          transition: var(--transition-smooth);
        }
        .nav-link:hover, .nav-link.active {
          color: var(--text-primary);
        }
        .nav-link.active::after {
          content: '';
          position: absolute;
          bottom: 0;
          left: 0;
          width: 100%;
          height: 2px;
          background-color: var(--accent-gold);
        }
        .inline-header-icons {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          padding-left: 0.75rem;
          border-left: 1px solid var(--border-color);
        }
        .header-icon-btn {
          width: 34px;
          height: 34px;
          border-radius: var(--radius-full);
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: var(--bg-main);
          border: 1px solid var(--border-color);
          color: var(--text-primary);
          transition: var(--transition-smooth);
          text-decoration: none;
        }
        .header-icon-btn.theme-toggle-btn:hover {
          background-color: var(--accent-gold-light);
          border-color: var(--accent-gold);
          transform: translateY(-2px) scale(1.05);
        }
        .sun-icon { color: #F59E0B; }
        .moon-icon { color: #8B5CF6; }
        .header-icon-btn.nav-wa:hover {
          background-color: #25D366;
          border-color: #25D366;
          color: #FFFFFF;
          transform: translateY(-2px);
        }
        .header-icon-btn.nav-mail:hover {
          background-color: var(--text-primary);
          border-color: var(--text-primary);
          color: var(--accent-gold);
          transform: translateY(-2px);
        }
        .header-icon-btn.nav-insta:hover {
          background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);

        .hero-section {
          background-color: var(--bg-main);
          padding: 3.5rem 0 4rem;
          border-bottom: 1px solid var(--border-color);
          position: relative;
          overflow: hidden;
        }
        .hero-container {
          display: grid;
          grid-template-columns: 1fr;
          gap: 2.5rem;
          align-items: center;
        }
        @media (min-width: 850px) {
          .hero-container {
            grid-template-columns: 1.1fr 0.9fr;
          }
        }
        .hero-badge {
          display: inline-block;
          font-size: 0.725rem;
          font-weight: 700;
          letter-spacing: 0.15em;
          color: var(--accent-gold-dark);
          background-color: var(--accent-gold-light);
          padding: 0.3rem 0.75rem;
          border-radius: var(--radius-full);
          margin-bottom: 1.25rem;
          border: 1px solid var(--border-color);
        }
        .hero-heading {
          font-size: clamp(1.85rem, 6.5vw, 3.5rem);
          line-height: 1.15;
          color: var(--text-primary);
          margin-bottom: 0.75rem;
          font-weight: 700;
        }
        .hero-heading-sub {
          color: var(--accent-gold);
          font-weight: 500;
        }
        .hero-small-text {
          font-size: clamp(0.9rem, 2.8vw, 1.05rem);
          color: var(--text-secondary);
          margin-bottom: 2rem;
          letter-spacing: 0.05em;
          font-weight: 500;
        }
        .hero-actions {
          display: flex;
          flex-wrap: wrap;
          gap: 0.75rem;
          margin-bottom: 1.5rem;
        }
        .hero-btn {
          flex: 1 1 140px;
          min-width: 0;
          box-sizing: border-box;
        }
        .hero-insta-badge-wrap {
          margin-top: 0.5rem;
        }
        .hero-insta-badge {
          display: inline-flex;
          align-items: center;
          gap: 0.6rem;
          padding: 0.4rem 0.85rem;
          max-width: 100%;
          background-color: #FFFFFF;
          border-radius: var(--radius-full);
          border: 1px solid var(--border-color);
          font-size: clamp(0.725rem, 2.2vw, 0.8rem);
          color: var(--text-primary);
          box-shadow: var(--shadow-sm);
          transition: var(--transition-smooth);
        }
        .hero-insta-badge:hover {
          border-color: #E1306C;
          color: #E1306C;
          transform: translateY(-2px);
        }
        .insta-icon-circle {
          width: 26px;
          height: 26px;
          background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
          color: #FFFFFF;
          border-radius: var(--radius-full);
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
        }
        
        /* Continuous Background Animation Effects */
        .hero-visual {
          position: relative;
          padding: 0.5rem;
          width: 100%;
          box-sizing: border-box;
        }
        .continuous-gold-aura-ring {
          position: absolute;
          top: -20px;
          right: -20px;
          width: clamp(180px, 45vw, 280px);
          height: clamp(180px, 45vw, 280px);
          border-radius: 50%;
          border: 2px dashed rgba(212, 175, 55, 0.35);
          animation: continuousRotate 28s linear infinite;
          pointer-events: none;
          z-index: 1;
        }
        .continuous-gold-glow-orb-1 {
          position: absolute;
          top: 10%;
          left: 10%;
          width: clamp(150px, 35vw, 220px);
          height: clamp(150px, 35vw, 220px);
          border-radius: 50%;
          background: radial-gradient(circle, rgba(212, 175, 55, 0.25) 0%, rgba(212, 175, 55, 0) 70%);
          filter: blur(25px);
          animation: floatingGlow 10s ease-in-out infinite alternate;
          pointer-events: none;
          z-index: 1;
        }
        .continuous-gold-glow-orb-2 {
          position: absolute;
          bottom: 10%;
          right: 5%;
          width: clamp(160px, 40vw, 260px);
          height: clamp(160px, 40vw, 260px);
          border-radius: 50%;
          background: radial-gradient(circle, rgba(245, 215, 127, 0.22) 0%, rgba(212, 175, 55, 0) 70%);
          filter: blur(30px);
          animation: floatingGlow 14s ease-in-out infinite alternate-reverse;
          pointer-events: none;
          z-index: 1;
        }

        @keyframes continuousRotate {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        @keyframes floatingGlow {
          0% { transform: translate(0, 0) scale(0.9); opacity: 0.6; }
          50% { transform: translate(25px, -20px) scale(1.15); opacity: 0.95; }
          100% { transform: translate(-15px, 15px) scale(0.95); opacity: 0.7; }
        }

        /* Ultra Smooth Layered Cross-Fade Slider Container */
        .hero-slider-wrapper {
          position: relative;
          z-index: 2;
          width: 100%;
        }

        .hero-card-grid-container {
          position: relative;
          width: 100%;
          min-height: clamp(240px, 58vw, 440px);
        }

        .slide-layer {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          opacity: 0;
          visibility: hidden;
          transform: scale(0.96) translateY(6px);
          transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1), 
                      transform 1.2s cubic-bezier(0.25, 1, 0.5, 1),
                      visibility 1.2s step-end;
          pointer-events: none;
          z-index: 1;
        }

        .slide-layer.slide-active {
          opacity: 1;
          visibility: visible;
          transform: scale(1) translateY(0);
          transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1), 
                      transform 1.2s cubic-bezier(0.25, 1, 0.5, 1),
                      visibility 0s step-start;
          pointer-events: auto;
          z-index: 3;
        }

        .hero-card-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: clamp(0.5rem, 2.5vw, 1.25rem);
          height: 100%;
        }

        .hero-image-card {
          position: relative;
          border-radius: var(--radius-md);
          overflow: hidden;
          box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
          border: 1px solid rgba(212, 175, 55, 0.3);
          aspect-ratio: 4/5;
          background: #FFF;
          transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
        }
        .hero-image-card img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          transition: transform 0.5s ease;
        }
        .hero-image-card:hover {
          box-shadow: 0 15px 35px rgba(212, 175, 55, 0.25);
          border-color: var(--accent-gold);
        }
        .hero-image-card:hover img {
          transform: scale(1.08);
        }
        .hero-tag {
          position: absolute;
          bottom: 1rem;
          left: 1rem;
          background: rgba(28, 28, 28, 0.88);
          color: #FFF;
          backdrop-filter: blur(6px);
          font-size: 0.75rem;
          font-weight: 700;
          letter-spacing: 0.1em;
          padding: 0.3rem 0.75rem;
          border-radius: var(--radius-sm);
          border: 1px solid rgba(212, 175, 55, 0.4);
        }
        .card-1 {
          animation: floatGentle 5s ease-in-out infinite;
        }
        .card-2 {
          transform: translateY(1.25rem);
          animation: floatGentle 5s ease-in-out infinite 2.5s;
        }

        /* Slider Bar Controls */
        .slider-controls-bar {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 1rem;
          margin-top: 1.5rem;
        }
        .slider-arrow-btn {
          width: 32px;
          height: 32px;
          border-radius: 50%;
          border: 1px solid var(--border-color);
          background: #FFFFFF;
          color: var(--text-primary);
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          transition: var(--transition-smooth);
        }
        .slider-arrow-btn:hover {
          background: var(--accent-gold);
          color: #FFFFFF;
          border-color: var(--accent-gold);
        }
        .slider-dots {
          display: flex;
          align-items: center;
          gap: 0.4rem;
        }
        .slider-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #CBD5E1;
          border: none;
          cursor: pointer;
          transition: all 0.4s ease;
        }
        .slider-dot.active {
          width: 22px;
          border-radius: 10px;
          background: var(--accent-gold);
        }

        .catalog-section {
          padding: 4rem 0;
          background-color: var(--bg-main);
        }
        .catalog-header {
          text-align: center;
          margin-bottom: 2rem;
        }
        .catalog-sub-desc {
          font-size: 0.95rem;
          color: var(--text-secondary);
          max-width: 600px;
          margin: 0.5rem auto 0;
        }
        .catalog-controls {
          display: flex;
          flex-direction: column;
          gap: 1rem;
          margin-bottom: 1.5rem;
          align-items: center;
          justify-content: space-between;
        }
        @media (min-width: 768px) {
          .catalog-controls {
            flex-direction: row;
          }
        }
        .category-tabs {
          display: flex;
          gap: 0.5rem;
          overflow-x: auto;
          width: 100%;
          padding-bottom: 0.25rem;
        }
        @media (min-width: 768px) {
          .category-tabs {
            width: auto;
          }
        }
        .cat-tab {
          padding: 0.6rem 1.25rem;
          border-radius: var(--radius-sm);
          font-size: 0.8rem;
          font-weight: 700;
          letter-spacing: 0.08em;
          color: var(--text-secondary);
          background-color: var(--bg-surface);
          border: 1px solid var(--border-color);
          white-space: nowrap;
          transition: var(--transition-smooth);
        }
        .cat-tab:hover {
          color: var(--text-primary);
          border-color: var(--accent-gold);
        }
        .cat-tab.active {
          background-color: var(--text-primary);
          color: #FFFFFF;
          border-color: var(--text-primary);
        }
        .search-box {
          position: relative;
          width: 100%;
          max-width: 320px;
        }
        .search-icon {
          position: absolute;
          left: 0.85rem;
          top: 50%;
          transform: translateY(-50%);
          color: var(--text-muted);
        }
        .search-box input {
          width: 100%;
          padding: 0.65rem 2rem 0.65rem 2.4rem;
          border-radius: var(--radius-sm);
          border: 1px solid var(--border-color);
          background-color: #FFFFFF;
          font-size: 0.85rem;
          color: var(--text-primary);
          outline: none;
          transition: var(--transition-smooth);
        }
        .search-box input:focus {
          border-color: var(--accent-gold);
          box-shadow: 0 0 0 3px var(--accent-gold-light);
        }
        .clear-search {
          position: absolute;
          right: 0.75rem;
          top: 50%;
          transform: translateY(-50%);
          font-size: 1.25rem;
          color: var(--text-muted);
        }
        .subcategory-bar {
          display: flex;
          flex-direction: column;
          gap: 0.85rem;
          padding: 0.85rem 1.25rem;
          background-color: #FFFFFF;
          border-radius: var(--radius-sm);
          border: 1px solid var(--border-color);
          margin-bottom: 1.25rem;
        }
        @media (min-width: 768px) {
          .subcategory-bar {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
          }
        }
        .subcat-pills {
          display: flex;
          align-items: center;
          gap: 0.5rem;

        .product-detail-page-root {
          min-height: 100vh;
          background-color: var(--bg-main);
          padding-bottom: 7rem;
          overflow-x: hidden;
          width: 100%;
          max-width: 100%;
          box-sizing: border-box;
        }

        /* Multi-Image Gallery Styling */
        .gallery-zoom-trigger {
          position: absolute;
          bottom: 0.75rem;
          right: 0.75rem;
          background: rgba(15, 23, 42, 0.8);
          color: #FFFFFF;
          font-size: 0.7rem;
          font-weight: 700;
          padding: 0.35rem 0.65rem;
          border-radius: var(--radius-full);
          display: flex;
          align-items: center;
          gap: 0.3rem;
          backdrop-filter: blur(4px);
          z-index: 5;
          border: 1px solid rgba(255, 255, 255, 0.2);
          transition: var(--transition-smooth);
        }
        .gallery-zoom-trigger:hover {
          background: var(--text-primary);
          color: var(--accent-gold);
        }

        .gallery-counter-chip {
          position: absolute;
          bottom: 0.75rem;
          left: 0.75rem;
          background: rgba(15, 23, 42, 0.8);
          color: #FFFFFF;
          font-size: 0.7rem;
          font-weight: 700;
          padding: 0.3rem 0.65rem;
          border-radius: var(--radius-full);
          backdrop-filter: blur(4px);
          z-index: 5;
          border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .gallery-arrow-btn {
          position: absolute;
          top: 50%;
          transform: translateY(-50%);
          width: 38px;
          height: 38px;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.9);
          border: 1px solid var(--border-color);
          color: var(--text-primary);
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 6;
          box-shadow: var(--shadow-sm);
          transition: all 0.2s ease;
        }
        .gallery-arrow-btn:hover {
          background: var(--text-primary);
          color: var(--accent-gold);
        }
        .gallery-arrow-btn.prev-arrow { left: 0.65rem; }
        .gallery-arrow-btn.next-arrow { right: 0.65rem; }

        .gallery-thumbnails-wrapper {
          display: flex;
          gap: 0.6rem;
          overflow-x: auto;
          padding: 0.3rem 0.1rem;
          scrollbar-width: thin;
          max-width: 100%;
        }
        .gallery-thumb-item {
          width: 64px;
          height: 64px;
          flex-shrink: 0;
          border-radius: var(--radius-sm);
          border: 2px solid var(--border-color);
          overflow: hidden;
          background: #FFFFFF;
          padding: 2px;
          cursor: pointer;
          transition: all 0.2s ease;
        }
        .gallery-thumb-item img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          border-radius: 4px;
        }
        .gallery-thumb-item.active {
          border-color: var(--accent-gold);
          box-shadow: 0 0 0 2px var(--accent-gold-light);
          transform: scale(1.04);
        }

        /* LIGHTBOX STYLING */
        .lightbox-backdrop {
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          background: rgba(0, 0, 0, 0.92);
          z-index: 999999;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 1rem;
          animation: fadeIn 0.2s ease;
        }
        .lightbox-container {
          position: relative;
          width: 100%;
          max-width: 900px;
          height: 100%;
          max-height: 90vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: space-between;
        }
        .lightbox-close-btn {
          position: absolute;
          top: 0.5rem;
          right: 0.5rem;
          background: rgba(255, 255, 255, 0.2);
          color: #FFFFFF;
          border-radius: 50%;
          width: 42px;
          height: 42px;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 10;
          transition: background 0.2s ease;
        }
        .lightbox-close-btn:hover {
          background: #FFFFFF;
          color: #000;
        }
        .lightbox-main-stage {
          position: relative;
          flex-grow: 1;
          width: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
        }
        .lightbox-img {
          max-width: 100%;
          max-height: 72vh;
          object-fit: contain;
          border-radius: 8px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .lightbox-nav-btn {
          position: absolute;
          top: 50%;
          transform: translateY(-50%);
          background: rgba(255, 255, 255, 0.2);
          color: #FFFFFF;
          border-radius: 50%;
          width: 50px;
          height: 50px;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 10;
          transition: all 0.2s ease;
        }
        .lightbox-nav-btn:hover {
          background: #FFFFFF;
          color: #000000;
        }
        .lightbox-nav-btn.prev { left: 1rem; }
        .lightbox-nav-btn.next { right: 1rem; }

        .lightbox-footer {
          width: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 0.75rem;
          padding-top: 0.5rem;
        }
        .lightbox-counter {
          color: #E2E8F0;
          font-size: 0.85rem;
          font-weight: 600;
          text-align: center;
        }
        .lightbox-thumbs {
          display: flex;
          gap: 0.5rem;
        }
        .lightbox-thumb {
          width: 48px;
          height: 48px;
          border-radius: 6px;
          border: 2px solid transparent;
          overflow: hidden;
          opacity: 0.6;
          transition: all 0.2s ease;
        }
        .lightbox-thumb img {
          width: 100%; height: 100%; object-fit: cover;
        }
        .lightbox-thumb.active {
          border-color: var(--accent-gold);
          opacity: 1;
        }

        .detail-top-bar {
          background-color: var(--bg-surface);
          border-bottom: 1px solid var(--border-color);
          padding: 0.85rem 0;
          position: sticky;
          top: 0;
          z-index: 100;
          box-shadow: var(--shadow-sm);
        }

        .detail-bar-flex {
          display: flex;
          align-items: center;
          justify-content: space-between;
          flex-wrap: wrap;
          gap: 0.75rem;
        }

        .btn-back-catalogue {
          display: inline-flex;
          align-items: center;
          gap: 0.5rem;
          background-color: var(--text-primary);
          color: #FFFFFF;
          font-size: 0.785rem;
          font-weight: 700;
          letter-spacing: 0.06em;
          padding: 0.55rem 1.1rem;
          border-radius: var(--radius-sm);
          transition: var(--transition-smooth);
        }
        .btn-back-catalogue:hover {
          background-color: var(--accent-gold);
          color: var(--text-primary);
        }

        .detail-breadcrumbs {
          font-size: 0.75rem;
          color: var(--text-secondary);
          display: flex;
          align-items: center;
          gap: 0.35rem;
          font-weight: 600;
          flex-wrap: wrap;
        }
        .crumb-sep { color: var(--text-muted); }
        .crumb-active { color: var(--accent-gold-dark); font-weight: 700; }

        .detail-main-container {
          margin-top: 1.5rem;
          padding: 0 0.5rem;
        }

        .product-showcase-grid {
          display: grid;
          grid-template-columns: 1fr;
          gap: 1.5rem;
          background-color: var(--bg-surface);
          border: 1px solid var(--border-color);
          border-radius: var(--radius-md);
          padding: 1.25rem 1rem;
          box-shadow: var(--shadow-md);
          width: 100%;
          max-width: 100%;
          box-sizing: border-box;
          overflow: hidden;
        }
        @media (min-width: 900px) {
          .product-showcase-grid {
            grid-template-columns: 1.1fr 1.25fr;
            padding: 3rem;
            gap: 2.5rem;
          }
        }

        /* Left Image Showcase */
        .showcase-image-col {
          display: flex;
          flex-direction: column;
          gap: 1.25rem;
          width: 100%;
          max-width: 100%;
          box-sizing: border-box;
        }

        .main-image-card {
          position: relative;
          background-color: #FFFFFF;
          border-radius: var(--radius-md);
          border: 1px solid var(--border-color);
          overflow: hidden;
          box-shadow: var(--shadow-sm);
          aspect-ratio: 1 / 1;
          width: 100%;
          max-width: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          box-sizing: border-box;
        }

        .category-float-badge {
          position: absolute;
          top: 0.75rem;
          left: 0.75rem;
          z-index: 2;
        }
        .subcategory-float-badge {
          position: absolute;
          top: 0.75rem;
          right: 0.75rem;
          z-index: 2;
          background: rgba(28, 28, 28, 0.85);
          color: #FFFFFF;
          font-size: 0.7rem;
          font-weight: 700;
          padding: 0.3rem 0.65rem;
          border-radius: var(--radius-full);
          backdrop-filter: blur(4px);
        }

        .product-main-img {
          width: 100%;
          max-width: 100%;
          height: 100%;
          max-height: 100%;
          object-fit: cover;
          transition: transform 0.4s ease;
          cursor: pointer;
          display: block;
        }
        .main-image-card:hover .product-main-img {
          transform: scale(1.03);
        }

        .guarantee-pills-row {
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
          width: 100%;
          box-sizing: border-box;
        }
        .guarantee-pill {
          background-color: var(--bg-main);
          border: 1px solid var(--border-color);
          padding: 0.6rem 0.85rem;
          border-radius: var(--radius-sm);
          font-size: 0.8rem;
          font-weight: 600;
          color: var(--text-primary);
          display: flex;
          align-items: center;
          gap: 0.5rem;
          word-break: break-word;
        }
        .pill-icon {
          color: var(--accent-gold-dark);
          flex-shrink: 0;
        }

        /* Right Info Column */
        .showcase-info-col {
          display: flex;
          flex-direction: column;
          gap: 1.15rem;
          width: 100%;
          max-width: 100%;
          box-sizing: border-box;
          overflow: hidden;
        }

        .info-meta-tags {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          flex-wrap: wrap;
        }
        .meta-subcat-chip {
          font-size: 0.75rem;
          font-weight: 700;
          color: var(--text-secondary);
          background-color: var(--bg-main);
          padding: 0.25rem 0.75rem;
          border-radius: var(--radius-full);
          border: 1px solid var(--border-color);
        }

        .detail-product-title {
          font-family: var(--font-heading);
          font-size: clamp(1.35rem, 5.5vw, 2.5rem);
          font-weight: 700;
          color: var(--text-primary);
          line-height: 1.25;
          word-break: break-word;
          overflow-wrap: break-word;
        }

        .detail-price-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          flex-wrap: wrap;
          gap: 0.75rem;
        }

        .detail-price {
          font-family: var(--font-heading);
          font-size: clamp(1.5rem, 6vw, 2.25rem);
          font-weight: 700;
          color: var(--accent-gold-dark);
        }

        .stock-status-badge {
          font-size: 0.775rem;
          font-weight: 700;
          padding: 0.35rem 0.75rem;
          border-radius: var(--radius-full);
          display: inline-flex;
          align-items: center;
          gap: 0.35rem;
        }
        .stock-status-badge.in-stock {
          background-color: #DEF7EC;
          color: #03543F;
        }
        .stock-status-badge.out-stock {
          background-color: #FDE8E8;
          color: #9B1C1C;
        }

        .detail-divider {
          height: 1px;
          background-color: var(--border-color);
        }

        .detail-desc-box {
          display: flex;
          flex-direction: column;
          gap: 0.4rem;
        }
        .desc-heading {
          font-size: 0.8rem;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          color: var(--text-secondary);
        }
        .desc-text {
          font-size: 0.95rem;
          color: var(--text-primary);
          line-height: 1.6;
          word-break: break-word;
          overflow-wrap: break-word;
        }

        /* Specifications Card */

        }
        .buy-now-header p {
          font-size: 0.75rem;

          width: 60px;

          object-fit: cover;
          border-radius: var(--radius-sm);
          border: 1px solid var(--border-color);

          font-weight: 700;

          background: linear-gradient(180deg, var(--bg-surface) 0%, #F4ECE0 100%);

          overflow: hidden;
        }

          background-color: #FFFFFF;

            padding: 4rem 3.5rem;

          font-size: 0.75rem;
          font-weight: 700;
          letter-spacing: 0.12em;

          margin-bottom: 0.85rem;
          border: 1px solid var(--accent-gold);

          font-weight: 700;
          color: var(--text-primary);
          margin-bottom: 0.75rem;
        }
        @media (min-width: 768px) {
          .animated-gradient-title {
            font-size: 2.75rem;
          }
        }

        .gold-animated-line {
          width: 80px;
          height: 3px;
          background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
          margin: 0 auto 1.25rem;
          border-radius: 99px;
          animation: linePulse 2.5s infinite ease-in-out;
        }
        @keyframes linePulse {
          0%, 100% { transform: scaleX(0.7); opacity: 0.6; }
          50% { transform: scaleX(1.3); opacity: 1; }
        }

        .about-subtitle {
          font-size: 1.05rem;
          color: var(--text-secondary);
          max-width: 720px;
          margin: 0 auto;
          line-height: 1.6;
        }

        /* 2 Column Layout Grid */
        .about-grid-content {
          display: grid;
          grid-template-columns: 1fr;
          gap: 3rem;
          margin-top: 3.5rem;
          align-items: start;
        }
        @media (min-width: 992px) {
          .about-grid-content {
            grid-template-columns: 1fr 1.15fr;
          }
        }

        .about-story-col {
          display: flex;
          flex-direction: column;
          gap: 2rem;
        }

          display: flex;
          align-items: center;
          gap: 1.5rem;
          background-color: var(--bg-main);
          padding: 1.5rem 1.75rem;
          border-radius: var(--radius-md);
          border: 1px solid var(--border-color);
          box-shadow: var(--shadow-sm);
        }

          position: relative;
          width: 76px;
          height: 76px;
          flex-shrink: 0;
          border-radius: var(--radius-sm);
          padding: 4px;
          background: linear-gradient(135deg, #C5A059, #F4ECE0, #A3803C);
          animation: logoGlow 3s infinite alternate ease-in-out;

        @keyframes logoGlow {
          from { box-shadow: 0 0 10px rgba(197, 160, 89, 0.3); }
          to { box-shadow: 0 0 25px rgba(197, 160, 89, 0.7); }

          width: 100%;
          height: 100%;
          object-fit: contain;
          border-radius: calc(var(--radius-sm) - 2px);
          background-color: #FFFFFF;

          background-color: var(--bg-main);
          padding: 1.75rem;
          border-radius: var(--radius-md);
          border: 1px solid var(--border-color);
          animation: fadeIn 0.3s ease-out;

          color: var(--text-secondary);
          line-height: 1.6;
          margin-bottom: 1.25rem;

          grid-template-columns: repeat(2, 1fr);

          letter-spacing: 0.05em;

        /* Highlights Motion Grid */
        .highlights-motion-grid {
          display: grid;
          grid-template-columns: 1fr;
          gap: 1rem;

        @media (min-width: 600px) {
          .highlights-motion-grid {
            grid-template-columns: repeat(2, 1fr);
          }

        .motion-highlight-card {
          background-color: #FFFFFF;
          border: 1px solid var(--border-color);
          border-radius: var(--radius-sm);
          padding: 1.35rem;
          transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);

        .motion-icon-box {

          color: var(--accent-gold-dark);
          border-radius: var(--radius-sm);
          display: flex;
          align-items: center;
          justify-content: center;
          transition: transform 0.3s ease;

        .admin-page-root {
          min-height: 100vh;
          background-color: #F4F1EA;
          color: var(--text-primary);
          display: flex;
          flex-direction: column;
          font-family: var(--font-body);
        }

        .admin-page-header {
          background-color: var(--text-primary);
          color: #FFFFFF;
          padding: 1rem 2rem;
          display: flex;
          align-items: center;
          justify-content: space-between;
          border-bottom: 2px solid var(--accent-gold);
          flex-wrap: wrap;
          gap: 1rem;
        }

        .admin-header-brand {
          display: flex;
          align-items: center;
          gap: 0.85rem;
        }

        .admin-brand-logo-img {
          height: 44px;
          width: auto;
          object-fit: contain;
          border-radius: var(--radius-sm);
        }

        .admin-header-brand h1 {
          font-family: var(--font-heading);
          font-size: 1.45rem;
          color: #FFFFFF;
          font-weight: 700;
          line-height: 1.1;
        }

        .admin-header-sub {
          font-size: 0.7rem;
          letter-spacing: 0.15em;
          color: var(--accent-gold);
          font-weight: 600;
        }

        .admin-header-actions {
          display: flex;
          align-items: center;
          gap: 0.65rem;
          flex-wrap: wrap;
        }

        .admin-btn-action {
          display: flex;
          align-items: center;
          gap: 0.35rem;
          padding: 0.5rem 0.85rem;
          background: rgba(255, 255, 255, 0.1);
          border: 1px solid rgba(255, 255, 255, 0.2);
          color: #E2DDD5;
          border-radius: var(--radius-sm);
          font-size: 0.775rem;
          font-weight: 600;
          cursor: pointer;
          transition: var(--transition-smooth);
        }

        .admin-btn-action:hover {
          background-color: rgba(255, 255, 255, 0.2);
          color: #FFF;
        }

        .admin-btn-action.danger {
          background-color: rgba(239, 68, 68, 0.2);
          border-color: rgba(239, 68, 68, 0.4);
          color: #FCA5A5;
        }
        .admin-btn-action.danger:hover {
          background-color: #EF4444;
          color: #FFF;
        }

        .admin-btn-viewsite {
          display: flex;
          align-items: center;
          gap: 0.4rem;
          padding: 0.5rem 1rem;
          background-color: var(--accent-gold);
          color: var(--text-primary);
          font-weight: 700;
          font-size: 0.785rem;
          border-radius: var(--radius-sm);
          transition: var(--transition-smooth);
        }
        .admin-btn-viewsite:hover {
          background-color: #FFFFFF;
        }

        .admin-page-layout {
          display: grid;
          grid-template-columns: 260px 1fr;
          flex-grow: 1;
        }
        @media (max-width: 900px) {
          .admin-page-layout {
            grid-template-columns: 1fr;
          }
        }

        .admin-sidebar {
          background-color: #FFFFFF;
          border-right: 1px solid var(--border-color);
          padding: 1.5rem 1rem;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
        }

        .sidebar-nav {
          display: flex;
          flex-direction: column;
          gap: 0.4rem;
        }

        .sidebar-nav-item {
          display: flex;
          align-items: center;
          gap: 0.75rem;
          padding: 0.85rem 1rem;
          border-radius: var(--radius-sm);
          font-size: 0.875rem;
          font-weight: 600;
          color: var(--text-secondary);
          text-align: left;
          transition: var(--transition-smooth);
        }

        .sidebar-nav-item:hover {
          background-color: var(--bg-main);
          color: var(--text-primary);
        }

        .sidebar-nav-item.active {
          background-color: var(--text-primary);
          color: #FFFFFF;
          font-weight: 700;
        }

        .sidebar-footer-card {
          background-color: var(--bg-main);
          padding: 1rem;
          border-radius: var(--radius-sm);
          border: 1px solid var(--border-color);
          margin-top: 2rem;
        }
        .card-store-name {
          font-family: var(--font-heading);
          font-weight: 700;
          font-size: 1.05rem;
        }
        .sidebar-footer-card p {
          font-size: 0.75rem;
          color: var(--text-secondary);
          margin-bottom: 0.85rem;
        }
        .sidebar-logout-btn {
          display: flex;
          align-items: center;
          gap: 0.35rem;
          font-size: 0.75rem;
          font-weight: 700;
          color: #C62828;
          width: 100%;
        }

        .admin-main-content {
          padding: 2rem;
          overflow-y: auto;
        }

        .admin-card-panel {
          background-color: #FFFFFF;
          border-radius: var(--radius-md);
          border: 1px solid var(--border-color);
          padding: 2rem;
          box-shadow: var(--shadow-sm);
        }

        .panel-header-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 1.5rem;
          flex-wrap: wrap;
          gap: 1rem;
        }

        .panel-title {
          font-size: 1.65rem;
          font-weight: 700;
          color: var(--text-primary);
        }
        .panel-sub {
          font-size: 0.85rem;
          color: var(--text-secondary);
        }

        .orders-filter-bar {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 1rem;
          margin-bottom: 1.5rem;
          flex-wrap: wrap;
        }
        .order-status-pills {
          display: flex;
          gap: 0.4rem;
          flex-wrap: wrap;
        }
        .order-date-text {
          font-size: 0.725rem;
          color: var(--text-muted);
        }
        .contact-detail-line {
          font-size: 0.785rem;
          color: var(--text-secondary);
          display: flex;
          align-items: center;
          gap: 0.25rem;
          margin-top: 2px;
        }
        .address-box-cell {
          font-size: 0.825rem;
          color: var(--text-secondary);
          line-height: 1.35;
        }
        .status-dropdown {
          padding: 0.35rem 0.6rem;
          border-radius: var(--radius-sm);
          font-size: 0.775rem;
          font-weight: 700;
          outline: none;
          border: 1px solid var(--border-color);
        }
        .status-new-lead { background-color: #FFEBEE; color: #C62828; }
        .status-confirmed { background-color: #FFF8E1; color: #F57F17; }
        .status-shipped { background-color: #E3F2FD; color: #1565C0; }
        .status-delivered { background-color: #E8F5E9; color: #2E7D32; }
        .status-cancelled { background-color: #ECEFF1; color: #37474F; }

        .wa-btn {
          color: #25D366 !important;
          border-color: #25D366 !important;
          text-decoration: none;
        }
        .wa-btn:hover {
          background-color: #25D366 !important;
          color: #FFF !important;
        }

        .cat-selector-bar {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          flex-wrap: wrap;
          margin-bottom: 1rem;
        }
        .cat-label {
          font-size: 0.85rem;
          font-weight: 700;
        }
        .cat-pill {
          padding: 0.45rem 1rem;
          border-radius: var(--radius-full);
          font-size: 0.8rem;
          font-weight: 600;
          background-color: var(--bg-main);
          border: 1px solid var(--border-color);
          color: var(--text-secondary);
        }
        .cat-pill.active {
          background-color: var(--text-primary);
          color: #FFFFFF;
          border-color: var(--text-primary);
        }

        .subcat-admin-bar {
          display: flex;
          align-items: center;
          gap: 0.4rem;
          flex-wrap: wrap;
          margin-bottom: 1.5rem;
          padding: 0.75rem 1rem;
          background-color: var(--bg-main);
          border-radius: var(--radius-sm);
          border: 1px solid var(--border-color);
        }
        .subcat-admin-label {
          font-size: 0.775rem;
          font-weight: 700;
          color: var(--text-secondary);
          display: flex;
          align-items: center;
          gap: 0.3rem;
          text-transform: uppercase;
        }
        .subcat-admin-chip {
          padding: 0.35rem 0.85rem;
          border-radius: var(--radius-full);
          font-size: 0.75rem;
          font-weight: 600;
          background-color: #FFFFFF;
          border: 1px solid var(--border-color);
          color: var(--text-secondary);
        }
        .subcat-admin-chip.active {
          background-color: var(--accent-gold-light);
          border-color: var(--accent-gold);
          color: var(--accent-gold-dark);
          font-weight: 700;
        }

        .admin-table-container {
          overflow-x: auto;
        }

        .admin-full-table {
          width: 100%;
          border-collapse: collapse;
          font-size: 0.9rem;
        }
        .admin-full-table th {
          text-align: left;
          padding: 0.85rem 1rem;
          background-color: var(--bg-main);
          color: var(--text-primary);
          font-weight: 700;
          border-bottom: 1px solid var(--border-color);
          font-size: 0.75rem;
          text-transform: uppercase;
        }
        .admin-full-table td {
          padding: 1rem;
          border-bottom: 1px solid var(--border-light);
          vertical-align: middle;
        }
        .table-product-thumb {
          width: 52px;
          height: 52px;
          object-fit: cover;
          border-radius: var(--radius-sm);
          border: 1px solid var(--border-color);
        }
        .table-product-title {
          font-size: 0.95rem;
          color: var(--text-primary);
        }
        .table-product-desc {
          font-size: 0.775rem;
          color: var(--text-secondary);
        }
        .table-price-cell {
          font-family: var(--font-heading);
          font-size: 1.1rem;
          font-weight: 700;
        }

        .row-action-btns {
          display: flex;
          gap: 0.5rem;
        }
        .action-icon {
          display: inline-flex;
          align-items: center;
          gap: 0.3rem;
          padding: 0.4rem 0.75rem;
          border-radius: var(--radius-sm);
          font-size: 0.75rem;
          font-weight: 600;
          border: 1px solid var(--border-color);
          background-color: #FFFFFF;
        }
        .action-icon.edit:hover { background-color: var(--accent-gold-light); color: var(--accent-gold-dark); }
        .action-icon.delete:hover { background-color: #FFEBEE; color: #C62828; border-color: #FFCDD2; }

        .empty-table-cell {
          text-align: center;
          padding: 3rem;
          color: var(--text-secondary);
        }

        .admin-full-form {
          max-width: 800px;
        }
        .form-header-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 1.5rem;
          padding-bottom: 0.85rem;
          border-bottom: 1px solid var(--border-light);
        }
        .form-layout-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 1.25rem;
        }
        .form-group {
          display: flex;
          flex-direction: column;
          gap: 0.4rem;
        }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label { font-size: 0.8rem; font-weight: 700; }
        .form-group input, .form-group select, .form-group textarea {
          padding: 0.75rem 1rem;
          border-radius: var(--radius-sm);
          border: 1px solid var(--border-color);
          font-size: 0.9rem;
          font-family: var(--font-body);
          outline: none;
        }

        /* Admin Multi-Image Gallery Styling */
        .multi-img-header-bar {
          display: flex;
          align-items: center;
          justify-content: space-between;
          flex-wrap: wrap;
          gap: 0.5rem;
        }
        .multi-img-title {
          font-size: 0.85rem;
          font-weight: 700;
          color: var(--text-primary);
        }
        .img-count-badge {
          font-size: 0.75rem;
          font-weight: 700;
          color: var(--accent-gold-dark);
          background-color: var(--accent-gold-light);
          padding: 0.2rem 0.6rem;
          border-radius: var(--radius-full);
          border: 1px solid var(--accent-gold);
        }
        .form-hint-text {
          font-size: 0.775rem;
          color: var(--text-secondary);
          margin-bottom: 0.75rem;
        }

        .admin-photos-gallery-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
          gap: 1rem;
          margin-top: 0.5rem;
        }
        .admin-photo-card {
          background-color: var(--bg-main);
          border: 1px solid var(--border-color);
          border-radius: var(--radius-sm);
          padding: 0.65rem;
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
          position: relative;
        }
        .admin-photo-card.is-primary {
          border-color: var(--accent-gold);
          box-shadow: 0 0 0 1px var(--accent-gold);
          background-color: #FFFDF9;
        }
        .admin-photo-preview-wrap {
          position: relative;
          height: 120px;
          border-radius: var(--radius-sm);
          overflow: hidden;
          background: #FFF;
          border: 1px solid var(--border-light);
        }
        .admin-photo-preview-wrap img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        .primary-cover-badge {
          position: absolute;
          top: 0.35rem;
          left: 0.35rem;
          background: var(--text-primary);
          color: var(--accent-gold);
          font-size: 0.6rem;
          font-weight: 700;
          padding: 0.2rem 0.4rem;
          border-radius: 4px;
        }
        .photo-num-tag {
          position: absolute;
          bottom: 0.35rem;
          right: 0.35rem;
          background: rgba(0, 0, 0, 0.7);
          color: #FFF;
          font-size: 0.6rem;
          font-weight: 600;
          padding: 0.15rem 0.4rem;
          border-radius: 4px;
        }
        .admin-photo-actions {
          display: flex;
          flex-direction: column;
          gap: 0.35rem;
        }
        .btn-photo-action {
          font-size: 0.68rem;
          font-weight: 600;
          padding: 0.35rem 0.4rem;
          border-radius: 4px;
          border: 1px solid var(--border-color);
          background: #FFFFFF;
          color: var(--text-primary);
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 0.2rem;
          cursor: pointer;
        }
        .btn-photo-action:hover:not(:disabled) {
          background-color: var(--bg-main);
        }
        .btn-photo-action:disabled {
          opacity: 0.4;
          cursor: not-allowed;
        }
        .btn-photo-action.primary {
          background-color: var(--accent-gold);
          color: var(--text-primary);
          border-color: var(--accent-gold-dark);
          font-weight: 700;
        }
        .btn-photo-action.delete {
          color: #C62828;
          border-color: #FFCDD2;
        }
        .btn-photo-action.delete:hover {
          background-color: #FFEBEE;
        }
        .photo-order-btns {
          display: flex;
          gap: 0.25rem;
        }
        .photo-order-btns .btn-photo-action {
          flex: 1;
        }
        .add-img-subheading {
          font-size: 0.8rem;
          font-weight: 700;
          color: var(--text-primary);
        }
        .max-photos-reached-banner {
          background-color: #DEF7EC;
          border: 1px solid #31C48D;
          color: #03543F;
          font-size: 0.8rem;
          font-weight: 600;
          padding: 0.75rem 1rem;
          border-radius: var(--radius-sm);
